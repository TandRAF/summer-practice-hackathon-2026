services:
  api:
    build: ./api
    container_name: showup2move-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
    command: npm run dev
    volumes:
      - ./api:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev # 1. Ne folosim de Dockerfile-ul nou creat pentru dev
    container_name: showup2move-client
    ports:
      - "3000:5173" # 2. Mapăm portul tău 3000 pe portul nativ de Vite (5173)
    environment:
      - VITE_API_URL=${VITE_API_URL} # 3. Mutat din 'args' în 'environment' ca să fie citit live de serverul Vite
    depends_on:
      - api
    volumes:
      - ./client:/app # 4. Mapează folderul local în container pentru Live Reload!
      - /app/node_modules # Protejează librăriile interne ale containerului