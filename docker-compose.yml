services:
  api:
    build: ./api
    container_name: showup2move-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
    command: npm run dev
    volumes:
      - ./api:/app
      - /app/node_modules
  frontend:
    build: ./client
    container_name: showup2move-client
    ports:
      - "3000:80" 
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - PORT=80  
    depends_on:
      - api
    volumes:
      - ./client:/app
      - /app/node_modules